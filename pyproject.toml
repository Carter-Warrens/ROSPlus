[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosplus-control-plane"
version = "0.1.0"
description = "Executable ROSPlus control-plane reference slice"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
turbo = "rosplus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

